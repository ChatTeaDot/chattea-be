services:
  chattea-be:
    command:
      [
        "sh",
        "-c",
        "node --env-file-if-exists=.env dist/scripts/preflight.js && node --env-file-if-exists=.env dist/scripts/migrate.js && exec node dist/src/main.js",
      ]
    environment:
      DD_ENV: development
      DD_VERSION: dev
      NODE_ENV: development
      TRUST_PROXY: loopback
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USERNAME: chattea
      POSTGRES_PASSWORD: chattea-dev
      POSTGRES_DATABASE: chattea
      POSTGRES_SSL: "false"
      JWT_ACCESS_TOKEN_SECRET: dev-access-secret
      JWT_REFRESH_TOKEN_SECRET: dev-refresh-secret
      JWT_ACCESS_TOKEN_EXP: 15m
      JWT_REFRESH_TOKEN_EXP: 30d
      SIGNUP_TOKEN_SECRET: dev-signup-secret
      KAKAO_SIGNUP_TOKEN_SECRET: dev-kakao-signup-secret
      KAKAO_CLIENT_ID: dev-kakao-client-id
      KAKAO_CALLBACK_URL: http://localhost:4000/api/auth/kakao/callback
      PHONE_CODE_PEPPER: dev-only-pepper
      SMS_SENDER_ID: dev-sender
      CLIENT_URL: http://localhost:8081

  postgres:
    environment:
      POSTGRES_DB: chattea
      POSTGRES_USER: chattea
      POSTGRES_PASSWORD: chattea-dev
